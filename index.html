<!DOCTYPE html>
<html lang="en" data-theme="neon">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAMBO CLICKER</title>
<style>
:root{
  --font: ui-monospace, "Cascadia Mono", "JetBrains Mono", Consolas, monospace;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --glow: 0 0 8px color-mix(in srgb, var(--accent) 55%, transparent);
  --bg:#0a0612; --panel:#150c26; --panel2:#1e1136; --line:#3b2566;
  --text:#e8e2ff; --dim:#9d8ec4; --accent:#b14dff; --accent2:#00e5ff;
  --gold:#ffcc4d; --good:#3dffa8; --bad:#ff4d6d;
}
[data-theme="matrix"]{
  --bg:#04100a; --panel:#071a10; --panel2:#0b2416; --line:#1d5c33;
  --text:#d6ffe4; --dim:#6fbf87; --accent:#39ff88; --accent2:#00ffd5;
  --gold:#e6ff5c; --good:#39ff88; --bad:#ff5566;
}
[data-theme="mono"]{
  --bg:#0b0b0b; --panel:#141414; --panel2:#1c1c1c; --line:#3a3a3a;
  --text:#f2f2f2; --dim:#8a8a8a; --accent:#ffffff; --accent2:#c8c8c8;
  --gold:#f5c518; --good:#7ddc7d; --bad:#e05c5c;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text); font-family:var(--font);
  font-size:15px; line-height:1.45; font-variant-numeric:tabular-nums;
}
button{font:inherit; color:inherit}
.num{font-variant-numeric:tabular-nums}

/* ---- CC layout ---- */
/* Cookie Clicker is three bands: the cookie and its numbers on the left, stacked
   views in the middle, and the Store on the right. */
#app{
  display:grid; gap:var(--s4); padding:var(--s4);
  grid-template-columns:minmax(300px,26%) 1fr minmax(280px,22%);
  align-items:start; min-height:100vh;
}
.left{display:flex; flex-direction:column; align-items:center; gap:var(--s3); position:sticky; top:var(--s4)}
.mid{display:flex; flex-direction:column; gap:var(--s3); min-width:0}
.right{min-width:0}

/* Vertical tab stack, top left, as in CC. */
.tabs{display:flex; flex-direction:column; align-self:flex-start; gap:var(--s1); order:-1}
.tabs button{
  padding:var(--s1) var(--s3); background:var(--panel); border:1px solid var(--line);
  border-radius:6px 6px 0 0; cursor:pointer; font-size:13px; color:var(--text);
}
.tabs button:hover{border-color:var(--accent); color:var(--accent)}

/* The balance block sits above the cookie and is the most prominent text on screen. */
.balstack{text-align:center; display:flex; flex-direction:column; gap:2px; width:100%}
.bakery{font-size:13px; color:var(--dim)}
.bal{font-size:20px; color:var(--text)}
.total{font-size:34px; line-height:1.05; color:var(--text); text-shadow:var(--glow); font-weight:600}
.cpsline{font-size:16px; color:var(--bad)}
.sub{font-size:12px; color:var(--dim); display:flex; gap:var(--s3); flex-wrap:wrap; justify-content:center; overflow-wrap:anywhere; min-width:0}

.col{display:flex; flex-direction:column; gap:var(--s2)}
h2{
  margin:0 0 var(--s2); font-size:13px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--dim); font-weight:400;
}
.panel{
  background:var(--panel); border:1px solid var(--line); border-radius:10px;
  padding:var(--s3);
}
.empty{font-size:12px; color:var(--dim)}

/* ---- store rows: CC shape, icon + name + faded count, price underneath,
       and the whole row is the buy target rather than a separate button ---- */
.uphead{
  font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim);
  border-bottom:1px solid var(--line); padding-bottom:var(--s1); margin-bottom:var(--s2);
}
.brow{
  display:flex; align-items:center; gap:var(--s2); padding:var(--s2);
  border-radius:8px; border:1px solid transparent; cursor:pointer; position:relative;
}
.brow:hover:not(.capped){background:var(--panel2); border-color:var(--line)}
.brow.capped{opacity:.6; cursor:not-allowed}
.bico{width:26px; text-align:center; font-size:20px; color:var(--accent2); flex-shrink:0}
.bmain{flex:1; min-width:0}
.bname{font-size:16px; display:block}
.bcost{font-size:13px; color:var(--bad); display:block}
.bcost.ok{color:var(--good)}
.bown{
  font-size:26px; color:var(--dim); opacity:.45; font-variant-numeric:tabular-nums;
  flex-shrink:0; line-height:1;
}
.bmax{
  position:absolute; right:var(--s2); top:var(--s2); font-size:10px; color:var(--gold);
  letter-spacing:.1em;
}

/* Buy selector: "Buy | 1  10  100", a compact row, as in CC. */
.buysel{
  display:flex; align-items:center; gap:var(--s3); margin:var(--s2) 0;
  padding-bottom:var(--s2); border-bottom:1px solid var(--line);
}
.buysel .bl{font-size:12px; color:var(--dim); letter-spacing:.1em; text-transform:uppercase}
.buysel button{
  padding:2px var(--s3); background:transparent; border:1px solid transparent;
  border-radius:6px; cursor:pointer; font-size:14px; color:var(--dim);
}
.buysel button[aria-pressed="true"]{color:var(--accent); border-color:var(--accent)}
.buysel button:hover{color:var(--text)}

/* ---- upgrade icons: a horizontal row at the top of the store ---- */
#upgrades{display:flex; flex-wrap:wrap; gap:var(--s1); margin-bottom:var(--s2)}
.uico{
  width:44px; height:44px; display:flex; align-items:center; justify-content:center;
  font-size:24px; line-height:1; background:var(--panel2); border:1px solid var(--line);
  border-radius:8px; cursor:pointer;
}
.uico:hover:not(:disabled){border-width:2px; border-color:var(--accent); box-shadow:var(--glow)}
.uico:active:not(:disabled){transform:translateY(1px)}
.uico:disabled{opacity:.35; cursor:not-allowed}
@media (prefers-reduced-motion: reduce){ .uico:active:not(:disabled){transform:none} }

/* ---- click target: canvas money bill (step 10) ---- */
.billwrap{position:relative; width:240px; height:120px}
/* The backing store is 240*dpr for crispness, but it must NOT also become the layout
   size. With no CSS width the canvas laid out at 240*dpr CSS px -- 720px on a dpr-3 phone,
   which stretched the grid and pushed every panel off-screen. Pin the layout size. */
/* The shared overlay card is 560px, which was SHRINKING the 990px tree to fit -- the skill
   tree was displayed smaller than it was authored. The tree opens in a wide card instead.
   The width lives on .ovlbox (the dialog), not .ovl (the backdrop). */
.ovl.wide .ovlbox{width:min(1040px,94vw)}
#bill{display:block}
#bill{
  width:240px; height:120px; border-radius:8px; cursor:pointer;
  display:block; touch-action:manipulation;
}
#bill:focus-visible{outline:2px solid var(--accent2); outline-offset:3px}
#pops{position:absolute; inset:0; pointer-events:none; overflow:visible}
.pop{
  position:absolute; font-size:14px; font-weight:600; color:var(--good);
  text-shadow:0 0 8px #000; white-space:nowrap; will-change:transform,opacity;
  transform:translate(-50%,0);
}
.pop.big{color:var(--gold); font-size:17px}
.pop.bad{color:var(--bad)}
@keyframes rise{ to{ transform:translate(-50%,-60px); opacity:0 } }
@media (prefers-reduced-motion: reduce){ .pop{ display:none } }
#prestige{width:100%; max-width:420px}

/* ---- CC parity (step 9) ---- */
.srow{display:flex; align-items:center; gap:var(--s2); margin-top:var(--s2); font-size:12px}
.srow .pgain{flex:1}
.milkbar{
  height:8px; background:var(--panel2); border:1px solid var(--line); border-radius:6px;
  overflow:hidden; margin:var(--s1) 0; position:relative;
  width:240px; max-width:100%;
}
.milkbar i{display:block; height:100%; width:0; background:#e9fff0}
.milkbar b{
  position:absolute; inset:0; background:var(--bad); text-align:center;
  font-size:8px; color:#fff; font-weight:400;
}
#goldens{position:relative}
.gcookie{
  position:absolute; width:34px; height:34px; border-radius:50%; z-index:40;
  background:radial-gradient(circle at 35% 30%, #ffe9a8, #d8a63a 60%, #8a6318);
  border:2px solid #5c4109; cursor:pointer; display:flex; align-items:center;
  justify-content:center; font-size:14px; color:#5c4109;
  box-shadow:0 0 14px #ffcc4daa; transition:none;
}
.gcookie.fade{opacity:.35}
.gcookie:hover{transform:scale(1.12)}
.egg{
  position:absolute; inset:0; z-index:80; background:#000000d0;
  display:flex; align-items:center; justify-content:center; text-align:center;
  padding:var(--s5); font-size:15px; line-height:1.7;
}
.egg[hidden]{display:none}
.eggcode{color:var(--gold); letter-spacing:.08em}
.console{
  background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:var(--s3);
  font-size:13px;
}
.console .out{
  color:var(--dim); font-size:12px; white-space:pre-wrap; max-height:190px;
  overflow:auto; margin-top:var(--s2);
}
.graph{margin-top:var(--s3)}
.graph .glab{font-size:11px; color:var(--dim); margin-bottom:2px}
.graph canvas{display:block; width:100%; height:54px; background:var(--panel2); border:1px solid var(--line); border-radius:6px}

/* ---- achievements + stats (step 8) ---- */
.agrid{display:grid; grid-template-columns:1fr 1fr; gap:var(--s2); margin-top:var(--s2)}
.acard{
  display:flex; gap:var(--s2); padding:var(--s2); border-radius:8px;
  border:1px solid var(--line); background:var(--panel2); font-size:12px;
}
.acard.got{border-color:var(--good)}
.acard .ai{font-size:20px; line-height:1.2; flex-shrink:0}
.acard.locked{opacity:.4}
.acard .an{font-weight:600}
.acard .ad{color:var(--dim); font-size:11px}
.acard .ar{color:var(--gold); font-size:11px}
.statrow{display:flex; justify-content:space-between; gap:var(--s3); padding:3px 0; font-size:13px}
.statrow .k{color:var(--dim)}
.statrow .v{font-variant-numeric:tabular-nums}

/* ---- legacy (step 7) ---- */
#legacy[hidden]{display:none}
.lrow{display:flex; align-items:center; gap:var(--s2); margin-top:var(--s2)}
.lrow .pgain{flex:1}
.lhead{
  margin-top:var(--s3); padding-top:var(--s2); border-top:1px solid var(--line);
  font-size:11px; letter-spacing:.12em; color:var(--dim); text-transform:uppercase;
}
.pgrid{display:grid; grid-template-columns:1fr 1fr; gap:var(--s1); margin-top:var(--s1)}

/* ---- skill tree: a real tree, in its own overlay (step 11) ---- */
.tsvg{width:100%; height:auto; display:block}
.thead{fill:var(--dim); font-size:11px; text-anchor:middle; letter-spacing:.1em}
.tlink{stroke:var(--line); stroke-width:2}
.tlink.req{stroke:var(--accent); stroke-opacity:.45; stroke-dasharray:4 3}
.tnode rect{fill:var(--panel2); stroke:var(--line); stroke-width:1; cursor:pointer}
.tnode:hover rect{stroke:var(--accent); stroke-width:2}
.tnode.owned rect{stroke:var(--accent); stroke-width:2; fill:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
.tnode.maxed rect{stroke:var(--good); fill:color-mix(in srgb,var(--good) 16%,var(--panel2))}
.tnode.locked{opacity:.32; cursor:not-allowed}
.tnode.star.owned rect{stroke:var(--gold); fill:color-mix(in srgb,var(--gold) 14%,var(--panel2))}
.tn{fill:var(--text); font-size:15px; font-weight:600}
.tp{fill:var(--accent2); font-size:12px; letter-spacing:1px}
.td{fill:var(--dim); font-size:12px}
.td.poor{fill:var(--bad)}

/* ---- centre band information panels (step 11) ---- */
.bar{display:flex; align-items:center; gap:var(--s2); margin-top:var(--s2)}
.bar .bl{width:64px; font-size:12px; color:var(--dim); flex-shrink:0}
.bar .bt{flex:1; height:12px; background:var(--panel2); border-radius:6px; overflow:hidden}
.bar .bt i{display:block; height:100%; background:var(--accent); width:0}
.bar .bv{width:74px; text-align:right; font-size:12px; color:var(--text); font-variant-numeric:tabular-nums}
.owngrid{display:flex; flex-wrap:wrap; gap:var(--s1); margin-top:var(--s2)}
.owngrid .oico{
  width:34px; height:34px; display:flex; align-items:center; justify-content:center;
  font-size:18px; background:var(--panel2); border:1px solid var(--line); border-radius:6px;
}
.achprog{display:flex; align-items:center; gap:var(--s3); margin-top:var(--s2)}
.achbar{flex:1; height:10px; background:var(--panel2); border-radius:6px; overflow:hidden}
.achbar i{display:block; height:100%; background:var(--good); width:0; transition:width .3s}
.achprog span{font-size:12px; color:var(--dim); min-width:120px}
@media (prefers-reduced-motion: reduce){ .achbar i{transition:none} }

/* ---- skill tree (step 6) ---- */
.tbranch{
  font-size:11px; letter-spacing:.12em; color:var(--dim); text-transform:uppercase;
  margin:var(--s3) 0 var(--s1);
}
.tbranch:first-child{margin-top:0}
.tgrid{display:grid; grid-template-columns:1fr 1fr; gap:var(--s1)}
.chip{
  display:flex; flex-direction:column; gap:2px; text-align:left; padding:var(--s2);
  background:var(--panel2); border:1px solid var(--line); border-radius:8px;
  cursor:pointer; font-size:11px; line-height:1.3; color:var(--text);
}
.chip:hover:not(:disabled){border-width:2px; border-color:var(--accent); box-shadow:var(--glow); padding:calc(var(--s2) - 1px)}
.chip:active:not(:disabled){transform:translateY(1px)}
.chip:disabled{opacity:.35; cursor:not-allowed}
.chip.owned{border:2px solid var(--accent); box-shadow:var(--glow); padding:calc(var(--s2) - 1px)}
.chip.star.owned{border-color:var(--gold)}
.chip.maxed{opacity:1; border-color:var(--good)}
.chip.locked{opacity:.25}
.chip .cn{font-weight:600}
.chip .cd{color:var(--dim); font-size:10px; min-height:2.6em}
.chip .pips{letter-spacing:1px; color:var(--accent2); font-size:10px}
.chip .cc{color:var(--good); font-size:11px}
.chip .cc.poor{color:var(--bad)}
.tpoints{
  margin-top:var(--s3); padding-top:var(--s2); border-top:1px solid var(--line);
  font-size:12px; color:var(--dim);
}
@media (prefers-reduced-motion: reduce){ .chip:active:not(:disabled){transform:none} }

/* ---- prestige (step 5) ---- */
.pbar{
  height:10px; background:var(--panel2); border:1px solid var(--line);
  border-radius:6px; overflow:hidden; margin-bottom:var(--s2);
}
.pbar i{display:block; height:100%; width:0; background:var(--accent); transition:width .2s linear}
.pbar.full i{background:var(--gold); box-shadow:var(--glow)}
.prow{display:flex; align-items:center; gap:var(--s2); margin-top:var(--s1)}
.pnum{font-size:13px; color:var(--dim)}
.pgain{flex:1; font-size:13px}
.bbtn{
  padding:var(--s1) var(--s4); background:var(--panel2); border:1px solid var(--line);
  border-radius:6px; cursor:pointer; font-size:14px;
}
.bbtn:hover:not(:disabled){border-width:2px; border-color:var(--gold); box-shadow:var(--glow)}
.bbtn:active:not(:disabled){transform:translateY(1px)}
.bbtn:disabled{opacity:.35; cursor:not-allowed}
.pnote{margin:var(--s3) 0 0; font-size:12px; color:var(--dim)}
.banner{
  margin-top:var(--s2); padding:var(--s2) var(--s3); border-radius:8px;
  font-size:12px; letter-spacing:.06em; border:1px solid var(--good);
  background:color-mix(in srgb, var(--good) 14%, var(--panel2)); color:var(--text);
}
.banner.gold{border-color:var(--gold); background:color-mix(in srgb, var(--gold) 14%, var(--panel2))}
.banner[hidden]{display:none}
@media (prefers-reduced-motion: reduce){
  .pbar i{transition:none}
  .bbtn:active:not(:disabled){transform:none}
}

/* ---- toasts (step 4) ---- */
#toasts{
  position:fixed; left:50%; bottom:var(--s5); transform:translateX(-50%);
  display:flex; flex-direction:column; align-items:center; gap:var(--s2);
  z-index:60; pointer-events:none; max-width:min(92vw,560px);
}
.toast{
  background:var(--panel2); border:1px solid var(--accent); border-radius:8px;
  padding:var(--s2) var(--s4); box-shadow:var(--glow); font-size:13px;
  text-align:center;
}
.toast.warn{border-color:var(--bad)}
.toast.good{border-color:var(--good)}

/* ---- overlay panels (step 4) ---- */
.ovl{
  position:fixed; inset:0; background:#000000b8; z-index:70;
  display:flex; align-items:flex-start; justify-content:center;
  padding:var(--s5); overflow:auto;
}
.ovl[hidden]{display:none}
.ovlbox{
  background:var(--panel); border:1px solid var(--line); border-radius:12px;
  padding:var(--s5); width:min(560px,100%); box-shadow:var(--glow);
}
.ovlhead{display:flex; align-items:center; margin-bottom:var(--s4)}
.ovlhead h2{margin:0}
.ovlclose{
  margin-left:auto; width:30px; height:30px; line-height:1; background:var(--panel2);
  border:1px solid var(--line); border-radius:6px; cursor:pointer;
}
.ovlrow{
  display:flex; align-items:center; gap:var(--s3); padding:var(--s2) 0;
  border-top:1px solid var(--line);
}
.ovlrow:first-of-type{border-top:none}
.ovlrow label{flex:1}
.ovlrow .hint{font-size:12px; color:var(--dim); flex-basis:100%; margin-top:2px}
.btn{
  padding:var(--s1) var(--s3); background:var(--panel2); border:1px solid var(--line);
  border-radius:6px; cursor:pointer; font-size:13px;
}
.btn:hover:not(:disabled){border-width:2px; border-color:var(--accent); box-shadow:var(--glow)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.35; cursor:not-allowed}
.btn.danger:hover:not(:disabled){border-color:var(--bad)}
select.btn{padding-right:var(--s2)}

/* ---- storage warning (step 4) ---- */
#warn{
  background:color-mix(in srgb, var(--bad) 18%, var(--panel));
  border-bottom:1px solid var(--bad); padding:var(--s2) var(--s5);
  font-size:13px; color:var(--text);
}
#warn[hidden]{display:none}

@media (prefers-reduced-motion: reduce){ .btn:active:not(:disabled){transform:none} }

@media (max-width:1200px){
  #app{grid-template-columns:minmax(260px,32%) 1fr}
  .right{grid-column:1 / -1}
}
@media (max-width:900px){
  #app{grid-template-columns:minmax(0,1fr); padding:var(--s3)}
  .left{position:static; min-width:0}
  .tabs{flex-direction:row; flex-wrap:wrap}
  #tree{min-width:0}
}
</style>
</head>
<body>

<div id="warn" role="status" hidden></div>

<div id="app">

  <!-- LEFT: vertical tab stack, the balance block, then the click target.
       This mirrors Cookie Clicker's left third, where the cookie is the hero. -->
  <div class="left">
    <nav class="tabs" aria-label="Panels">
      <button type="button" data-panel="prefs">Options</button>
      <button type="button" data-panel="tree">Skill Tree</button>
    </nav>
    <div class="balstack">
      <div class="bakery" id="bakery">Rambo Bank</div>
      <div class="total" id="bal" aria-live="polite">0</div>
      <div class="cpsline">per second <span id="cps">0</span></div>
      <div class="sub" id="sub"></div>
    </div>
    <div class="billwrap">
      <canvas id="bill" width="240" height="120" role="button" tabindex="0"
              aria-label="Click the bill to earn cookies"></canvas>
      <div id="pops" aria-hidden="true"></div>
    </div>
    <div class="milkbar" id="milkbar"><i></i><b id="milktip"></b></div>
  </div>

  <!-- CENTRE: stacked panels, where CC puts its minigame views. -->
  <div class="mid">
    <section id="prestige" class="panel">
      <h2>Prestige</h2>
      <div class="pbar" id="pbar"><i></i></div>
      <div class="prow"><span class="pnum num" id="pnum"></span></div>
      <div class="prow">
        <span class="pgain" id="pgain"></span>
        <button class="bbtn" id="ascend" type="button">Ascend</button>
      </div>
      <p class="pnote" id="pnote"></p>
      <div id="banners"></div>
    </section>

    <section id="legacy" class="panel">
      <h2>Legacy</h2>
      <div class="lrow"><span class="pgain" id="lgain"></span></div>
      <div class="lrow"><button class="bbtn" id="legacybtn" type="button">Legacy</button></div>
      <div class="lhead">Perks</div>
      <div class="pgrid" id="pbody"></div>
      <div class="tpoints" id="lpoints"></div>
    </section>

    <!-- Centre band: the information views, where CC puts its minigame panels. -->
    <section id="econ" class="panel">
      <h2>Production</h2>
      <div id="bars"></div>
    </section>

    <section id="rate" class="panel">
      <h2>Over time</h2>
      <div class="graph"><canvas id="gcps2" width="720" height="90"></canvas></div>
    </section>

    <section id="owned" class="panel">
      <h2>Upgrades owned</h2>
      <div class="owngrid" id="owngrid"></div>
      <p class="empty" id="ownempty">No upgrades yet.</p>
    </section>

    <section id="achpanel" class="panel">
      <h2>Achievements</h2>
      <div class="achprog"><div class="achbar"><i id="achfill"></i></div><span id="achlabel"></span></div>
      <div class="agrid" id="achbody"></div>
    </section>

    <section id="statspanel" class="panel">
      <h2>Stats</h2>
      <div id="statbody"></div>
    </section>
  </div>

  <!-- RIGHT: the Store. CC keeps the building list on the right, not the left. -->
  <div class="right">
    <section id="store" class="panel">
      <h2>Store</h2>
      <button class="uphead btn" id="buyall" type="button">Buy all upgrades</button>
      <div id="upgrades"></div>
      <div class="buysel" id="buysel" role="group" aria-label="Buy amount"></div>
      <div id="brows"></div>
      <div id="goldens"></div>
    </section>
  </div>

</div>

<div id="toasts" aria-live="polite"></div>

<div class="egg" id="egg" hidden></div>

<div class="ovl" id="ovl" hidden>
  <div class="ovlbox" role="dialog" aria-modal="true" aria-labelledby="ovltitle">
    <div class="ovlhead">
      <h2 id="ovltitle">Preferences</h2>
      <button type="button" class="ovlclose" id="ovlclose" aria-label="Close">&times;</button>
    </div>
    <div id="ovlbody"></div>
  </div>
</div>

<script>
'use strict';

// ---------------------------------------------------------------- state
const KEY = 'clicker.v1';
const CEIL = Number.MAX_VALUE / 1e6;   // global finite ceiling, applied at accumulation

const DEFAULTS = {
  coins: 0, clicks: 0,
  totalEarned: 0, runEarned: 0, legacyEarned: 0,
  buildings: [0, 0, 0, 0, 0, 0],
  upgrades: [],
  ascend: { runs: 0, points: 0, earned: 0 },
  legacy: { runs: 0, points: 0, earned: 0 },
  tree: {}, perks: {}, ach: {},
  milk: { progress: 0, rank: 0, lifetime: 0 },
  ui: { theme: 'neon', muted: false, buyAmount: 1, bannerDismissed: false, persistent: true, bankName: 'Rambo Bank' },
  played: 0,
  lastSave: 0,
};

const state = structuredClone(DEFAULTS);

// ---------------------------------------------------------------- storage
// Firefox denies localStorage on file:// and Safari does the same in private mode.
// Without this shim the first getItem throws and the game never renders, so every
// access goes through store and never touches localStorage directly.
const SAVE_VERSION = 1;
const mem = new Map();
const lsOK = (() => {
  try {
    localStorage.setItem('__p', '1');
    localStorage.removeItem('__p');
    return true;
  } catch { return false; }
})();
const store = {
  get: k => lsOK ? localStorage.getItem(k) : (mem.get(k) ?? null),
  set: (k, v) => { if (lsOK) { try { localStorage.setItem(k, v); } catch {} } else mem.set(k, v); },
  del: k => { if (lsOK) { try { localStorage.removeItem(k); } catch {} } else mem.delete(k); },
};
state.ui.persistent = lsOK;

// A reset deletes the save and then reloads. The reload fires pagehide, and the
// pagehide handler saves. Without this guard the flush writes the state straight back
// on the way out and the "reset" restores everything it just deleted.
let wiping = false;

function save() {
  if (wiping) return;
  state.lastSave = Date.now();
  store.set(KEY, JSON.stringify({ v: SAVE_VERSION, state }));
}

// Returns true if a save was applied. Never overwrites a save it did not understand.
function load() {
  const raw = store.get(KEY);
  if (!raw) return false;
  let data;
  try { data = JSON.parse(raw); } catch { return false; }
  if (!data || typeof data !== 'object') return false;
  if (typeof data.v === 'number' && data.v > SAVE_VERSION) {
    toast(`Save is version ${data.v}, this build understands ${SAVE_VERSION}. Not loading it.`, 'warn', 9000);
    return false;
  }
  const src = data.state || {};
  for (const k of Object.keys(state)) {
    if (src[k] !== undefined) state[k] = src[k];
  }
  return true;
}

// ---------------------------------------------------------------- toasts
function toast(msg, kind = '', ms = 4000) {
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' ' + kind : '');
  el.textContent = msg;
  $('toasts').append(el);
  setTimeout(() => el.remove(), ms);
}

// Runtime-only. Never persisted: anything a reload could reset for free lives here.
const rt = { last: 0, idleMs: 0, lastClick: 0, investAcc: 0, offlineEarned: 0 };

const $ = id => document.getElementById(id);
const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;

// ---------------------------------------------------------------- formatter
const SUF = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc', 'Ud', 'Dd', 'Td'];
function fmt(v) {
  if (!isFinite(v)) return '∞';
  if (v < 1000)  return String(v < 10 ? +v.toFixed(2) : Math.floor(v));
  if (v < 1e6)   return Math.floor(v).toLocaleString('en-US');
  let i = 0, n = v;
  while (n >= 1000 && i < SUF.length - 1) { n /= 1000; i++; }
  if (n >= 999.5 && i < SUF.length - 1) { n /= 1000; i++; }
  // The ladder's last index is 14, so Td is 1e42, not 1e45. The CEIL clamp permits
  // 1.8e302, leaving 260 orders of magnitude uncovered. Past n >= 100 the ladder is
  // exhausted and either prints absurd integers (100000000Td) or, once float error
  // accumulates into the mantissa, silently wrong values (1.0000000000000002e+58Td).
  // Use v, not n: v is the true value, n carries the accumulated error.
  if (i === SUF.length - 1 && n >= 100) return v.toExponential(2);
  return (n < 10 ? n.toFixed(2) : n < 100 ? n.toFixed(1) : Math.floor(n)) + SUF[i];
}

// ---------------------------------------------------------------- buildings
const BUILDINGS = [
  { id:'b0', label:'Auto I',   icon:'◻', baseCost:50,      baseCps:1,     lore:'You would be amazed at what a well-oiled machine does with a single gram of dough.' },
  { id:'b1', label:'Auto II',  icon:'▣', baseCost:500,     baseCps:12,    lore:'It hums. It always hums. You have learned to tune it out. Mostly.' },
  { id:'b2', label:'Auto III', icon:'▤', baseCost:5000,    baseCps:100,   lore:'Production tripled overnight. Nobody asked how. Nobody wants to know.' },
  { id:'b3', label:'Auto IV',  icon:'▥', baseCost:50000,   baseCps:800,   lore:'The foreman has stopped sleeping. He says the machines dream in numbers.' },
  { id:'b4', label:'Auto V',   icon:'▦', baseCost:500000,  baseCps:6400,  lore:'At this scale output is measured in lifetimes rather than minutes.' },
  { id:'b5', label:'Auto VI',  icon:'▧', baseCost:5000000, baseCps:51000, lore:'We stopped calling it a factory. Now it is simply The Machine.' },
];
// Each building escalates on its OWN count, not on the total across all six.
// Cookie Clicker actually uses one shared exponent; this is a deliberate deviation,
// chosen so buying more of one building never inflates the price of another.
// Cost and output have to move together: if only the price went per-building, the
// top tier's first unit would cost 5e6 flat while still collecting the whole base's
// boost, and the economy would fall apart.
// Cost escalates per unit owned. Production does NOT.
//
// Cookie Clicker scales building COST by 1.15 per unit, but its production is FLAT per
// unit: a Cursor always yields its base CpS, 100 Cursors yield 100x that flat amount.
// The only thing that scales production is the global multiplier chain. There is no
// per-unit production exponent in CC at all, and having one here is what made the
// building layer exhaust itself in seven minutes.
const COST_RATE = 1.15;
const CAP = 1000;                       // hard cap per building
const totalBuildings = () => state.buildings.reduce((a, b) => a + b, 0);
const buildingCps = i => BUILDINGS[i].baseCps;

// ---------------------------------------------------------------- upgrades
// Buildings and upgrades are separate systems with separate lifetimes. Upgrades
// multiply, disappear permanently when bought, and are lost on Ascend and Legacy.
// u_b0..u_b4 multiply their own building only (per the branch table), not all cps.
const UPGRADES = [
  { id: 'u_c1', name: 'Reinforced Knuckles', icon: '✊', effect: '×2 click',        cost: 100,     unlock: () => true },
  { id: 'u_c2', name: 'Weighted Glove',      icon: '🥊', effect: '×2 click',        cost: 2000,    unlock: s => s.clicks >= 100 },
  { id: 'u_c3', name: 'Second Hand',         icon: '✋', effect: '×3 click',        cost: 40000,   unlock: s => s.clicks >= 500 },
  { id: 'u_c4', name: 'Autoclicker Mk I',    icon: '🤖', effect: '+2 cps',          cost: 500,     unlock: s => s.clicks >= 50 },
  { id: 'u_c5', name: 'Cloned Hands',        icon: '🖐', effect: 'clicks add 1% cps', cost: 20000,  unlock: s => s.clicks >= 250 },
  { id: 'u_c6', name: 'Golden Glove ★',   icon: '🌟', effect: '×10 click',       cost: 1000000, unlock: s => s.clicks >= 1000 },

  { id: 'u_b0', name: 'Overclocked Servo',   icon: '▣', effect: 'Auto I ×3',       cost: 300,     unlock: s => s.buildings[0] >= 10 },
  { id: 'u_b1', name: 'Tuned Assembly',      icon: '▤', effect: 'Auto II ×3',      cost: 5000,    unlock: s => s.buildings[1] >= 10 },
  { id: 'u_b2', name: 'Smelting Line',       icon: '▥', effect: 'Auto III ×3',     cost: 60000,   unlock: s => s.buildings[2] >= 10 },
  { id: 'u_b3', name: 'Quantum Plant',       icon: '▦', effect: 'Auto IV ×3',      cost: 700000,  unlock: s => s.buildings[3] >= 10 },
  { id: 'u_b4', name: 'Self-Improving Mill', icon: '▧', effect: 'Auto V ×3',       cost: 8000000, unlock: s => s.buildings[4] >= 10 },

  { id: 'u_g1', name: 'Bulk Buying',       icon: '🛒', effect: 'building costs ×0.9',           cost: 1000,    unlock: s => totalBuildings() >= 10 },
  { id: 'u_g2', name: 'Economies of Scale',icon: '📈', effect: 'all cps ×1.5',                 cost: 20000,   unlock: s => totalBuildings() >= 20 },
  { id: 'u_g3', name: 'Additive Boost ★',icon: '➕', effect: 'all cps ×2',                    cost: 250000,  unlock: s => totalBuildings() >= 35 },
  { id: 'u_g4', name: 'Compound Engine',   icon: '🧬', effect: 'cps ×1.05 per building',      cost: 2000000, unlock: s => totalBuildings() >= 50 },
  { id: 'u_g5', name: 'Interest Rate',     icon: '🏦', effect: 'cps ×1.25',                    cost: 25000000,unlock: () => d.cps >= 1e6 },
  { id: 'u_g6', name: 'Credit Line',       icon: '💳', effect: 'cps ×(1 + coins / 1e7)',       cost: 50000,   unlock: s => s.totalEarned >= 1e7 },
  { id: 'u_g7', name: 'Recruitment Drive', icon: '📉', effect: 'building costs ×0.75',         cost: 500000,  unlock: s => totalBuildings() >= 40 },
  { id: 'u_g8', name: 'Bargain Bin ★',   icon: '🏷', effect: 'all upgrade costs ×0.8',        cost: 5000000, unlock: s => s.upgrades.length >= 5 },
  { id: 'u_g9', name: 'Market Manipulation ★', icon: '🎲', effect: 'cps ×(1 + buildings / 10)', cost: 500000000, unlock: s => totalBuildings() >= 80 },
];

const has = id => state.upgrades.includes(id);
const unlockCost = u => Math.floor(u.cost * (has('u_g8') ? 0.8 : 1));

// Locked upgrades are never rendered. Conditions are re-read every paint, so an
// upgrade appears the instant its condition flips true, with no purchase needed.
const visibleUpgrades = () =>
  UPGRADES.filter(u => !has(u.id) && u.unlock(state)).sort((a, b) => a.cost - b.cost);

function buyUpgrade(u) {
  const cost = unlockCost(u);
  if (has(u.id) || !isFinite(cost) || cost > state.coins) return false;
  state.coins -= cost;
  state.upgrades.push(u.id);
  sfx('upgrade');
  render();   // the icon goes now, not on the next tick
  return true;
}

// Buys every unlocked upgrade it can afford, cheapest first so a partial balance goes to
// the things that unlock the most. Re-reads the list each pass because buying one can
// unlock the next (u_g5 needs cps >= 1e6, which an earlier buy may push it over).
function buyAllUpgrades() {
  let bought = 0;
  for (;;) {
    const open = visibleUpgrades().filter(u => unlockCost(u) <= state.coins);
    if (!open.length) break;
    if (!buyUpgrade(open[0])) break;
    bought++;
    if (bought > 200) break;   // pathological guard; there are ~50 upgrades
  }
  return bought;
}

// Coin-cost discount, shared by buildings and upgrades. L1 (step 7) extends this.
const discount = () => Math.max(
  0.4,
  Math.pow(0.95, treeRank('E1')) * Math.pow(0.95, perkRank('L1'))
    * (has('u_g1') ? 0.9 : 1) * (has('u_g7') ? 0.75 : 1)
);

// One shared exponent: every unit purchased raises every building's cost and output.
const unitPrice = (i, extra) =>
  Math.floor(BUILDINGS[i].baseCost * Math.pow(COST_RATE, state.buildings[i] + extra) * discount());

// Sum of individually floored unit prices. Never floor() the sum.
function costOf(i, n) {
  let sum = 0;
  for (let k = 0; k < n; k++) sum += unitPrice(i, k);
  return sum;
}

// MAX is bounded twice: the 1000 cap bounds the loop, the balance check bounds it
// far sooner and is the only thing stopping 1.12^k from overflowing mid-walk.
function maxAffordable(i) {
  const room = CAP - state.buildings[i];
  let n = 0, sum = 0;
  for (; n < room; n++) {
    const c = unitPrice(i, n);
    if (!isFinite(c) || sum + c > state.coins) break;
    sum += c;
  }
  return n;
}

function buyCount(i) {
  const room = CAP - state.buildings[i];
  if (room <= 0) return 0;
  return state.ui.buyAmount === 'max' ? maxAffordable(i) : Math.min(state.ui.buyAmount, room);
}

function buyBuilding(i) {
  const n = buyCount(i);
  if (n <= 0) return;
  const cost = costOf(i, n);
  if (!isFinite(cost) || cost > state.coins) return;
  state.coins -= cost;
  state.buildings[i] += n;
  sfx('building');
}

// ---------------------------------------------------------------- derived (never stored)
const d = { cps: 0, clickPower: 1 };
const idleMult = () => Math.min(5, Math.pow(1.05, treeRank('E2') * (rt.idleMs / 60000)));

function clickPower() {
  // Upgrades are one-shot, so each factor is 1 or n, never n^rank.
  let p = 1;
  if (has('u_c1')) p *= 2;
  if (has('u_c2')) p *= 2;
  if (has('u_c3')) p *= 3;
  if (has('u_c6')) p *= 10;
  // Achievements deliberately do NOT touch click power. a1 'First Blood' pays x1.05 to
  // all gains and unlocks on click #1, so it was applied from the very first click and a
  // plain click paid 1.05 -- the base read as 1.05 and never as 1. It still boosts cps.
  p *= ascendMult() * legacyMult();
  if (frenzyOn()) p *= FRENZY_MULT;
  // Cloned Hands pays a share of cps per click. Additive, same reason as C2:
  // a multiplicative factor here would be self-referential and undefined.
  if (has('u_c5')) p += 0.01 * d.cps;
  // C1 is additive per rank, M2 is a flat permanent multiplier.
  p *= (1 + 0.5 * treeRank('C1')) * Math.pow(5, treeRank('M2'));
  // C3 decays after 3s without a click, C4 is a 3s window every 30s. Both are runtime
  // clocks: a reload resetting them is the correct behaviour, not an exploit.
  if (treeRank('C3') && performance.now() - rt.lastClick < 3000) p *= 2;
  if (treeRank('C4') && performance.now() % 30000 < 3000) p *= 10;
  return p;
}

function calc() {
  let cps = 0;
  for (let i = 0; i < BUILDINGS.length; i++) {
    // Flat per unit: the owned count multiplies the base value, it does not compound.
    cps += state.buildings[i] * buildingCps(i) * (has('u_b' + i) ? 3 : 1);
  }
  if (has('u_g2')) cps *= 1.5;
  if (has('u_g3')) cps *= 2;
  if (has('u_g4')) cps *= Math.pow(1.05, totalBuildings());
  if (has('u_g5')) cps *= 1.25;
  // Reads coins held, which this same tick's production raises. calc() runs before
  // coins are credited, so it settles on the previous tick's value instead of looping.
  if (has('u_g6')) cps *= 1 + state.coins / 1e7;
  if (has('u_g9')) cps *= 1 + totalBuildings() / 10;
  if (has('u_c4')) cps += 2;
  cps *= achBonus();
  // Skill tree: A1 compounds per rank, A3 is additive, E2 compounds with idle time and
  // caps at x5 so it cannot run away during a long absence.
  cps *= Math.pow(1.05, treeRank('A1')) * (1 + 0.2 * treeRank('A3'));
  cps *= idleMult();
  cps *= milkMult() * cpsBoostMult();
  // Prestige multipliers. They read `earned`, never the spendable `points` pool, so
  // buying a tree node can never lower the player's multiplier.
  cps *= ascendMult() * legacyMult();
  // L2 Legacy Engines compounds per rank.
  cps *= Math.pow(1.2, perkRank('L2'));
  // Milk folds in here.
  d.cps = Math.min(cps, CEIL);
  d.clickPower = Math.min(clickPower(), CEIL);
}

// ---------------------------------------------------------------- economy
// Earned coins: they count toward prestige. Injected coins (E3, golden cookies,
// the 3-minutes-of-cps reward) must NOT come through here.
function earn(n) {
  if (!(n > 0)) return;
  state.coins = Math.min(state.coins + n, CEIL);
  state.runEarned = Math.min(state.runEarned + n, CEIL);
  state.totalEarned = Math.min(state.totalEarned + n, CEIL);
  // Banked toward the next Legacy. Only income that genuinely counts as earned gets
  // here, so injected payouts (E3, golden cookies, offline without U3) do not.
  state.legacyEarned = Math.min(state.legacyEarned + n, CEIL);
}

function click() {
  const now = performance.now();
  pulseAt = now;
  sfx('click');
  popup('+' + fmt(d.clickPower));
  rt.lastClick = now;
  rt.idleMs = 0;
  state.clicks++;
  earn(d.clickPower);
  checkAchievements();
  dropMilk();
}

// ---------------------------------------------------------------- tick
function tick() {
  const now = performance.now();
  // 60s upper bound, not 1s: hidden tabs get throttled to ~1 tick/min.
  const dt = clamp(now - rt.last, 0, 60000);
  rt.last = now;
  rt.idleMs += dt;
  state.played = Math.min((state.played || 0) + dt, CEIL);
  calc();
  checkAchievements();
  graphSample();
  // Stats and the production graph live in the centre band now, so they refresh here on
  // the 250ms tick rather than in render(): rebuilding statbody and redrawing a large
  // canvas 60 times a second is pure waste, and the data only moves 4x/second.
  paintStats();
  drawGraph($('gcps2'), rt.gCps);
  // Golden cookies spawn per tick, so a backgrounded tab ticking once a minute would
  // eat the intended one-per-three-minutes rate. Gate on visibility.
  if (document.visibilityState === 'visible' && Math.random() < GOLDEN_CHANCE) spawnGolden();
  // Passive income goes through earn(). Crediting state.coins directly would leave
  // runEarned and totalEarned untouched, which zeroes out Ascend points and makes
  // u_g6's totalEarned >= 1e7 unlock permanently unreachable.
  earn(d.cps * dt / 1000);
  // E4 Gold Rush: 1% per tick for a x50 burst. Rolled per tick, so it fires about
  // 4 times a minute at 4 ticks/sec, and scales with dt like ordinary income does.
  if (treeRank('E4') && d.cps > 0 && Math.random() < 0.01) earn(d.cps * dt / 1000 * 50);
  // A4 Auto-Invest: one building every 10s, cheapest first. Not a while-loop -- looping
  // would make it auto-max and remove the reason to click anything.
  if (treeRank('A4')) {
    rt.investAcc += dt;
    if (rt.investAcc >= 10000) {
      rt.investAcc = 0;
      let best = -1, bestCost = Infinity;
      for (let i = 0; i < BUILDINGS.length; i++) {
        if (state.buildings[i] >= CAP) continue;
        const c = unitPrice(i, 0);
        if (c <= state.coins && c < bestCost) { bestCost = c; best = i; }
      }
      if (best >= 0) { state.coins -= bestCost; state.buildings[best]++; }
    }
  }
}

// ---------------------------------------------------------------- render
const AMOUNTS = [['1', 1], ['10', 10], ['100', 100], ['MAX', 'max']];
const ui2 = { rows: [], sel: [], ups: new Map(), upKey: '', chips: new Map(), perks: new Map(), bars: [], tnodes: new Map() };

function buildBuildingsUI() {
  const sel = $('buysel');
  const lab = document.createElement('span');
  lab.className = 'bl';
  lab.textContent = 'Buy';
  sel.append(lab);
  for (const [label, val] of AMOUNTS) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = label;
    b.addEventListener('click', () => { state.ui.buyAmount = val; });
    sel.append(b);
    ui2.sel.push(b);
  }
  const host = $('brows');
  BUILDINGS.forEach((b, i) => {
    const row = document.createElement('div');
    row.className = 'brow';
    row.setAttribute('role', 'button');
    row.tabIndex = 0;
    row.innerHTML =
      `<span class="bico">${b.icon}</span>` +
      `<span class="bmain"><span class="bname">${b.label}</span>` +
      `<span class="bcost num"></span></span>` +
      `<span class="bown num">0</span><span class="bmax">MAX</span>`;
    // CC has no per-row Buy button: the row itself is the target.
    row.addEventListener('click', () => buyBuilding(i));
    row.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); buyBuilding(i); }
    });
    row.title = b.lore;
    host.append(row);
    ui2.rows.push({
      row: row,
      own: row.querySelector('.bown'),
      cost: row.querySelector('.bcost'),
      max: row.querySelector('.bmax'),
    });
  });
}

function paintBuildings() {
  for (const [k, b] of ui2.sel.entries()) b.setAttribute('aria-pressed', String(state.ui.buyAmount === AMOUNTS[k][1]));
  // Buildings depend on the balance, which moves every frame -- so the signature uses
  // coarse buckets of the two things that actually change a row: unit count and coins.
  if (!changed('buildings', state.buildings.join(',') + '|' +
      Math.floor(state.coins) + '|' + state.ui.buyAmount)) return;
  BUILDINGS.forEach((b, i) => {
    const el = ui2.rows[i];
    const n = state.buildings[i];
    const capped = n >= CAP;
    const count = buyCount(i);
    const cost = count ? costOf(i, count) : Infinity;
    const afford = !capped && count > 0 && isFinite(cost) && cost <= state.coins;

    el.own.textContent = fmt(n);
    // Price shown is for the selected buy amount, not one unit. CC does the same:
    // a row reading "Buy 10" must show what 10 costs, or the target is a guess.
    el.cost.textContent = fmt(count > 0 && isFinite(cost) ? cost : unitPrice(i, 0));
    el.cost.classList.toggle('ok', afford);
    el.max.style.display = capped ? '' : 'none';
    el.row.classList.toggle('capped', capped || !afford);
    el.row.setAttribute('aria-disabled', String(capped || !afford));
  });
}

function paintUpgrades() {
  const list = visibleUpgrades();
  const key = list.map(u => u.id).join(',');
  if (key !== ui2.upKey) {
    ui2.upKey = key;
    ui2.ups.clear();
    const host = $('upgrades');
    host.querySelectorAll('.uico').forEach(n => n.remove());
    for (const u of list) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'uico';
      b.textContent = u.icon;
      b.title = `${u.name} — ${u.effect} — ${fmt(unlockCost(u))} cookies`;
      b.setAttribute('aria-label', b.title);
      b.addEventListener('click', () => buyUpgrade(u));
      host.append(b);
      ui2.ups.set(u.id, b);
    }
  }
  for (const u of list) ui2.ups.get(u.id).disabled = unlockCost(u) > state.coins;
}

// The tree is drawn as an actual tree: five branch columns, four depth rows, SVG
// connectors. Positions come from (branch, depth), not from document flow, so the
// prereq links can be drawn as curves between columns.
const TREE_COLS = 5, TREE_ROWS = 4;
const TREE_CW = 190, TREE_CH = 104, TREE_PAD = 20;
function treePos(t) {
  const col = BRANCHES.findIndex(b => b[0] === t.br);
  const depth = TREE.filter(n => n.br === t.br).indexOf(t);
  return { x: TREE_PAD + col * TREE_CW, y: TREE_PAD + 18 + depth * TREE_CH };
}
const TREE_W = TREE_PAD * 2 + TREE_COLS * TREE_CW;
const TREE_H = TREE_PAD * 2 + 18 + TREE_ROWS * TREE_CH;

function treeEdge(id) {
  const t = node(id);
  const a = treePos(t);
  const prev = TREE.filter(n => n.br === t.br);
  const i = prev.indexOf(t);
  let d = '';
  if (i > 0) {
    // vertical link down the same branch
    const b = treePos(prev[i - 1]);
    const x = a.x + TREE_CW / 2, y1 = b.y + TREE_CH - 10, y2 = a.y + 2;
    d += `<line class="tlink" x1="${x}" y1="${y1}" x2="${x}" y2="${y2}"/>`;
  }
  if (t.req) {
    // curved link across branches
    const r = node(t.req);
    const b = treePos(r);
    const x1 = b.x + TREE_CW / 2, y1 = b.y + TREE_CH - 10;
    const x2 = a.x + TREE_CW / 2, y2 = a.y + 2;
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2 - 18;
    d += `<path class="tlink req" fill="none" d="M${x1},${y1} Q${mx},${my} ${x2},${y2}"/>`;
  }
  return d;
}

function buildTreeUI() {
  const host = $('tbody');
  host.innerHTML = '<svg class="tsvg" viewBox="0 0 ' + TREE_W + ' ' + TREE_H + '" ' +
    'width="' + TREE_W + '" height="' + TREE_H + '">' +
    BRANCHES.map(([br, label], i) =>
      '<text class="thead" x="' + (TREE_PAD + i * TREE_CW + TREE_CW / 2) + '" y="14">' +
      label.replace(/ ./, ' ') + '</text>').join('') +
    TREE.map(t => treeEdge(t.id)).join('') +
    TREE.map(t => {
      const p = treePos(t);
      return '<g class="tnode" data-id="' + t.id + '" transform="translate(' +
        (p.x + 4) + ',' + p.y + ')">' +
        '<rect width="' + (TREE_CW - 12) + '" height="' + (TREE_CH - 16) + '" rx="7"/>' +
        '<text class="tn" x="8" y="16"></text>' +
        '<text class="tp" x="8" y="30"></text>' +
        '<text class="td" x="8" y="44"></text>' +
        '</g>';
    }).join('') +
    '</svg>';

  ui2.tnodes = new Map();
  for (const g of host.querySelectorAll('.tnode')) {
    const id = g.getAttribute('data-id');
    ui2.tnodes.set(id, g);
    g.addEventListener('click', () => buyNode(id));
  }
}

function paintTree() {
  if (!changed('tree', TREE.map(n => treeRank(n.id)).join(',') + '|' + state.ascend.points)) return;
  for (const t of TREE) {
    const el = ui2.tnodes.get(t.id);
    if (!el) continue;
    const rank = treeRank(t.id);
    const locked = treeLocked(t);
    const maxed = treeMaxed(t);
    el.classList.toggle('owned', rank > 0);
    el.classList.toggle('maxed', maxed);
    el.classList.toggle('locked', locked);
    el.classList.toggle('star', !!t.star);
    const pips = maxed ? '★'.repeat(t.max) : '●'.repeat(rank) + '○'.repeat(t.max - rank);
    let label;
    if (locked) label = 'needs ' + node(t.req).name;
    else if (maxed) label = 'maxed';
    else {
      const n = nodeCount(t.id);
      const cost = n > 0 ? nodeCost(t.id, n) : 0;
      label = fmt(cost) + ' pt' + (n > 1 ? ' ×' + n : '');
    }
    const q = c => el.querySelector('.' + c);
    q('tn').textContent = t.name;
    q('tp').textContent = pips;
    q('td').textContent = label;
    q('td').classList.toggle('poor', !locked && !maxed && nodeCost(t.id, 1) > state.ascend.points);
    el.setAttribute('aria-disabled', String(locked || maxed || state.ascend.points <= 0));
    const title = `${t.name} — ${t.desc} · max ${t.max} · ${label}`;
    el.querySelector('title') || el.append(Object.assign(document.createElement('title'), { textContent: title }));
  }
  const spent = TREE.reduce((a, n) => a + treeRank(n.id) * n.cost + n.step * (treeRank(n.id) * (treeRank(n.id) - 1) / 2), 0);
  $('tpoints').textContent = `${fmt(state.ascend.points)} pts spendable · ${fmt(spent)}/${TREE_TOTAL} invested`;
}

function buildLegacyUI() {
  const grid = $('pbody');
  for (const p of PERKS) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip' + (p.star ? ' star' : '');
    b.innerHTML =
      '<span class="cn"></span><span class="pips"></span>' +
      '<span class="cd"></span><span class="cc"></span>';
    b.querySelector('.cn').textContent = p.name;
    b.querySelector('.cd').textContent = p.desc;
    b.addEventListener('click', () => buyPerk(p.id));
    grid.append(b);
    ui2.perks.set(p.id, b);
  }
}

function paintLegacy() {
  if (!legacyUnlocked()) { $('legacy').hidden = true; return; }
  $('legacy').hidden = false;

  const gain = legacyGain();
  $('lgain').textContent = gain > 0
    ? `Enter now: +${fmt(gain)} point${gain === 1 ? '' : 's'}`
    : `Banked ${fmt(state.legacyEarned)} this layer · gains start at ${fmt(1e12)}`;
  $('legacybtn').disabled = gain <= 0;

  for (const p of PERKS) {
    const el = ui2.perks.get(p.id);
    const rank = perkRank(p.id);
    const maxed = perkMaxed(p);
    el.classList.toggle('owned', rank > 0);
    el.classList.toggle('maxed', maxed);
    el.querySelector('.pips').textContent = maxed ? '★'.repeat(p.max) : '●'.repeat(rank) + '○'.repeat(p.max - rank);
    const n = maxed ? 0 : perkCount(p.id);
    const cost = n > 0 ? perkCost(p.id, n) : 0;
    el.querySelector('.cc').textContent = maxed ? 'maxed' : fmt(cost) + ' pt' + (n > 1 ? ' ×' + n : '');
    el.querySelector('.cc').classList.toggle('poor', !maxed && cost > state.legacy.points);
    el.disabled = maxed || cost > state.legacy.points;
  }
  const spent = PERKS.reduce((a, p) => {
    const r = perkRank(p.id);
    return a + r * p.cost + p.step * (r * (r - 1) / 2);
  }, 0);
  $('lpoints').textContent = `${fmt(state.legacy.points)} pts · ${fmt(spent)}/${PERKS_TOTAL} invested`;
}

function paintBanners() {
  const treeDone = TREE.every(n => treeRank(n.id) >= n.max);
  const perksDone = PERKS.every(p => perkRank(p.id) >= p.max);
  const host = $('banners');
  if (!host) return;
  host.innerHTML =
    (treeDone ? '<div class="banner">SKILL TREE COMPLETE — ' + TREE_TOTAL + '/' + TREE_TOTAL + '</div>' : '') +
    (perksDone ? '<div class="banner gold">ETERNAL — buildings are yours</div>' : '');
}

function paintPrestige() {
  if (!changed('prestige',
    state.runEarned.toExponential(4) + '|' + state.ascend.runs + '|' + state.ascend.points + '|' +
    state.legacy.runs + '|' + state.legacy.points + '|' + state.legacyEarned.toExponential(4))) return;
  const gain = ascendGain();
  const ready = gain > 0;
  const pct = Math.min(100, state.runEarned / ASCEND_AT * 100);
  $('pbar').classList.toggle('full', ready);
  $('pbar').firstElementChild.style.width = pct.toFixed(2) + '%';
  $('pnum').textContent = `${fmt(state.runEarned)} of ${fmt(ASCEND_AT)} this run`;
  $('pgain').textContent = ready
    ? `Ascend now: +${fmt(gain)} point${gain === 1 ? '' : 's'}`
    : `Ascend unlocks at ${fmt(ASCEND_AT)} earned this run`;
  $('ascend').disabled = !ready;
  paintBanners();
  $('pnote').textContent = state.ascend.runs === 0
    ? 'Ascending resets cookies, buildings and upgrades. Skill tree and perks are kept.'
    : `Ascends: ${state.ascend.runs} · ×${ascendMult().toFixed(1)} lifetime` +
    (legacyUnlocked() ? ` · Legacy ${state.legacy.runs} · ×${legacyMult().toFixed(1)}` : ' · Legacy at 3 ascends');
}

function applyCompletion() {
  const done = TREE.every(n => treeRank(n.id) >= n.max);
  if (done && !/RAMBO FINANCIAL$/.test(document.title)) document.title = 'RAMBO FINANCIAL';
}

function render() {
  // The bank balance is the headline number, as in CC. Total earned is a statistic, not
  // the thing you look at, so it lives in the Stats panel rather than the left stack.
  // The bank name is a saved preference, so it is applied at boot and whenever it changes.
  // Guarded because older saves have no ui.bankName.
  $('bakery').textContent = state.ui.bankName || DEFAULTS.ui.bankName;
  $('bal').textContent = fmt(state.coins);
  $('cps').textContent = fmt(d.cps);
  $('sub').textContent =
    `${fmt(state.runEarned)} run · ×${ascendMult().toFixed(1)} ascend · ` +
    `×${legacyMult().toFixed(1)} legacy · ` +
    `${fmt(state.ascend.points)} pts · ${fmt(state.legacy.points)} legacy`;
  paintBuildings();
  paintUpgrades();
  // paintTree() is NOT called here. It writes $('tpoints'), and that element only exists
  // while the tree overlay is open -- openOvl builds #tbody/#tpoints on demand. Calling it
  // unconditionally made render() throw on the very first frame, which killed the rAF loop
  // below and left drawBill() never running once: a blank canvas, and a frozen UI. paint()
  // already calls it, correctly gated on `ovlName === 'tree'`.
  paintPrestige();
  paintLegacy();
  paintParity();
  paintBars();
  paintOwned();
  paintAchProgress();
  applyCompletion();
  if (ovlName === 'tree') paintTree();
}

// ---------------------------------------------------------------- ascend
const ASCEND_AT = 1e6;
const treeRank = id => state.tree[id] || 0;
const perkRank = id => state.perks[id] || 0;
const ascendMult = () => 1 + 0.15 * state.ascend.earned;
const legacyMult = () => 1 + 0.25 * state.legacy.earned;

// M1 and L7 are step 6 and 7; they read 0 until those land, and this needs no change.
// The divisor tracks the gate, so a minimum qualifying run is always worth 1 point. When
// the gate moved from 1e6 to 1e8 this was left hardcoded at 1e6, which paid 10 points for
// the smallest possible run.
function ascendGain() {
  if (state.runEarned < ASCEND_AT) return 0;
  const m1 = treeRank('M1'), l7 = perkRank('L7');
  return Math.floor(Math.sqrt(state.runEarned / ASCEND_AT) * (1 + 0.1 * m1) * (1 + 0.25 * l7));
}

// L8 (step 7) dissolves the reset entirely. Otherwise U4 keeps 5% and L4 keeps 25%.
// Most expensive units first: keeping the cheap ones hands back count while barely
// touching cps, which is not what the player paid points for.
function keptBuildings() {
  if (perkRank('L8')) return state.buildings.slice();
  const pct = treeRank('U4') ? 0.05 : (perkRank('L4') ? 0.25 : 0);
  let left = Math.floor(pct * totalBuildings());
  if (left <= 0) return [0, 0, 0, 0, 0, 0];
  const next = [0, 0, 0, 0, 0, 0];
  const order = BUILDINGS.map((b, i) => i).sort((a, b) => BUILDINGS[b].baseCost - BUILDINGS[a].baseCost);
  for (const i of order) {
    const take = Math.min(state.buildings[i], left);
    next[i] = take;
    left -= take;
    if (left <= 0) break;
  }
  return next;
}

// L3 (step 7) returns a random quarter of owned upgrades. Rounded up so a single
// owned upgrade is not silently kept or silently lost.
function keptUpgrades() {
  if (!perkRank('L3')) return [];
  const n = Math.ceil(0.25 * state.upgrades.length);
  if (n <= 0) return [];
  const pool = state.upgrades.slice();
  const keep = [];
  for (let i = 0; i < n && pool.length; i++) keep.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
  return keep;
}

function doAscend() {
  const gain = ascendGain();
  if (gain <= 0) return;
  if (!confirm(
    'Ascend?\n\n' +
    'You lose your cookies, buildings and upgrades.\n' +
    'You gain ' + fmt(gain) + ' ascend point' + (gain === 1 ? '' : 's') +
    (treeRank('U4') || perkRank('L4') ? '\nSome of your buildings survive.' : '') +
    '\n\nThis cannot be undone.'
  )) return;

  const keepB = keptBuildings();
  const keepU = keptUpgrades();
  // E3 (step 6) grants starting coins, at 1000 * 2^rank. It only applies once the node is
  // actually owned — otherwise every ascend hands out its rank-0 value for free.
  // Injected, so it is assigned directly and never goes through earn().
  const e3 = treeRank('E3');
  const start = e3 > 0 ? Math.min(1000 * Math.pow(2, e3), CEIL) : 0;

  state.coins = start;
  state.runEarned = 0;
  state.buildings = keepB;
  state.upgrades = keepU;
  state.ascend.runs++;
  state.ascend.points += gain;
  state.ascend.earned += gain;
  // clicks and totalEarned are lifetime and deliberately survive, so upgrade unlock
  // conditions and achievements stay satisfied across ascends.
  rt.last = performance.now();
  calc();
  save();
  paintPrestige();
  sfx('ascend');
  toast(`Ascended. +${fmt(gain)} ascend point${gain === 1 ? '' : 's'}.`, 'good', 6000);
}

// ---------------------------------------------------------------- skill tree
// Spent ascend points. Rank r costs `cost + (r-1)*step`, so the next rank out of a
// node at `rank` costs `cost + rank*step`. Prereq depth is 1 on purpose: no graph,
// no topological sort, no cycle handling.
const TREE = [
  { id:'C1', br:'click', name:'Reinforced Finger',  desc:'+50% click power',        cost:1,  step:1,  max:5 },
  { id:'C2', br:'click', name:'Combo Memory',       desc:'clicks add 3% of cps',    cost:3,  step:2,  max:3 },
  { id:'C3', br:'click', name:'Overclock',          desc:'x2 click for 3s after a click', cost:15, step:0, max:1 },
  { id:'C4', br:'click', name:'Adrenal Surge',      desc:'x10 click for 3s every 30s', cost:40, step:0, max:1, star:true, req:'C2' },

  { id:'A1', br:'auto',  name:'Servo Arm',          desc:'building cps x1.05',      cost:1,  step:1,  max:5 },
  { id:'A2', br:'auto',  name:'Tree Rush',          desc:'buy selector applies to node ranks', cost:8, step:0, max:1 },
  { id:'A3', br:'auto',  name:'Turbo Loop',         desc:'+20% cps',                cost:10, step:5,  max:3 },
  { id:'A4', br:'auto',  name:'Auto-Invest',        desc:'every 10s buy the cheapest building', cost:45, step:0, max:1, star:true, req:'A3' },

  { id:'E1', br:'econ',  name:'Discount Broker',    desc:'all coin costs x0.95',    cost:2,  step:2,  max:5 },
  { id:'E2', br:'econ',  name:'Compound Interest',  desc:'cps x1.05 per min idle, to x5', cost:12, step:0, max:3 },
  { id:'E3', br:'econ',  name:'Starting Capital',   desc:'start a run with 1000 x 2^rank', cost:3, step:3, max:5 },
  { id:'E4', br:'econ',  name:'Gold Rush',          desc:'1% per tick: x50 burst',  cost:35, step:0,  max:1, star:true, req:'E3' },

  { id:'U1', br:'util',  name:'Offline Boost',      desc:'offline rate +10%',       cost:4,  step:4,  max:5 },
  { id:'U2', br:'util',  name:'Extended Window',    desc:'offline cap +4h',         cost:6,  step:6,  max:3 },
  { id:'U3', br:'util',  name:'Time Insurance',     desc:'offline counts for ascend points', cost:6, step:0, max:1 },
  { id:'U4', br:'util',  name:'Second Wind',        desc:'keep 5% of buildings on Ascend', cost:30, step:0, max:1, star:true, req:'U3' },

  { id:'M1', br:'meta',  name:'Efficient Scarcity', desc:'ascend points +10%',      cost:20, step:10, max:3 },
  { id:'M2', br:'meta',  name:'Golden Touch',       desc:'x5 click power, always',  cost:25, step:0,  max:1 },
];
const BRANCHES = [
  ['click', '⚡ Click'], ['auto', '⟳ Auto'], ['econ', '◈ Economy'],
  ['util', '◷ Utility'], ['meta', '✦ Meta'],
];
const TREE_TOTAL = TREE.reduce((a, n) => a + n.max * n.cost + n.step * (n.max * (n.max - 1) / 2), 0);

const node = id => TREE.find(n => n.id === id);
const treeLocked = n => n.req && treeRank(n.req) < 1;
const treeMaxed = n => treeRank(n.id) >= n.max;

function nodeCost(id, n) {
  const t = node(id), rank = treeRank(id);
  let sum = 0;
  for (let k = 0; k < n; k++) sum += t.cost + (rank + k) * t.step;
  return sum;
}

// A2 Tree Rush lets the 1/10/100/MAX selector buy ranks too. Without it a node click
// is always exactly one rank.
function nodeCount(id) {
  const t = node(id), room = t.max - treeRank(id);
  if (room <= 0) return 0;
  if (!treeRank('A2')) return Math.min(1, room);
  if (state.ui.buyAmount !== 'max') return Math.min(state.ui.buyAmount, room);
  let n = 0, sum = 0;
  while (n < room) {
    const c = nodeCost(id, n + 1) - sum;
    if (!isFinite(c) || sum + c > state.ascend.points) break;
    sum += c;
    n++;
  }
  return n;
}

function buyNode(id) {
  const t = node(id);
  if (!t || treeLocked(t) || treeMaxed(t)) return;
  const n = nodeCount(id);
  if (n <= 0) return;
  const cost = nodeCost(id, n);
  if (!isFinite(cost) || cost > state.ascend.points) return;
  state.ascend.points -= cost;
  state.tree[id] = treeRank(id) + n;
  sfx('node');
  paintTree();
}

// ---------------------------------------------------------------- sound
// WebAudio oscillators, no files. One context, created on the first user gesture
// because the autoplay policy blocks it before that. Mute skips creation entirely,
// so a muted player never pays for a context.
let actx = null;
const voices = {};
function audio() {
  if (state.ui.muted) return null;
  if (!actx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; actx = new AC(); }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
const VOICE_CAP = 8;
function tone(name, f0, f1, dur, gain, type, delay) {
  const ctx = audio();
  if (!ctx) return;
  const list = voices[name] || (voices[name] = []);
  // Hold-to-click fires ten clicks a second. Past the cap, drop the oldest rather than
  // queueing, or the audio thread falls behind the sim.
  while (list.length >= VOICE_CAP) { const old = list.shift(); try { old.stop(); } catch {} }
  const t0 = ctx.currentTime + (delay || 0);
  const osc = ctx.createOscillator(), g = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(f0, t0);
  if (f1 && f1 !== f0) osc.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(gain, t0 + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g); g.connect(ctx.destination);
  osc.start(t0); osc.stop(t0 + dur + 0.02);
  list.push(osc);
  osc.onended = () => { const i = list.indexOf(osc); if (i >= 0) list.splice(i, 1); };
}
const clickPitch = () => 1 + 0.25 * Math.min(6, Math.log10(Math.max(1, d.clickPower)));
const SFX = {
  click:      () => tone('click', 220 * clickPitch(), 0, 0.06, 0.05, 'triangle'),
  building:   () => tone('building', 330, 494, 0.12, 0.07, 'triangle'),
  upgrade:    () => tone('upgrade', 523, 784, 0.14, 0.08, 'triangle'),
  node:       () => { tone('node', 392, 587, 0.22, 0.08, 'triangle'); tone('node', 880, 0, 0.12, 0.06, 'triangle', 0.1); },
  achievement:() => tone('ach', 659, 988, 0.28, 0.06, 'sawtooth'),
  golden:     () => { tone('gold', 880, 0, 0.08, 0.05, 'square'); tone('gold', 880, 0, 0.08, 0.05, 'square', 0.06); },
  ascend:     () => tone('ascend', 130, 65, 0.9, 0.09, 'sawtooth'),
  legacy:     () => { tone('legacy', 98, 196, 1.4, 0.1, 'sawtooth'); },
  error:      () => tone('err', 110, 0, 0.15, 0.06, 'square'),
};
const sfx = n => { try { (SFX[n] || SFX.error)(); } catch {} };

// ---------------------------------------------------------------- float popups
const popPool = [];
const reducedMotion = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function popup(text, kind) {
  if (reducedMotion()) return;
  const host = $('pops');
  if (!host) return;
  const el = popPool.pop() || (() => {
    const n = document.createElement('div');
    n.className = 'pop';
    return n;
  })();
  el.className = 'pop' + (kind ? ' ' + kind : '');
  el.textContent = text;
  el.style.left = 100 + (Math.random() * 80 - 40) + 'px';
  el.style.top = 40 + (Math.random() * 40 - 20) + 'px';
  el.style.opacity = '1';
  if (el.parentNode !== host) host.append(el);
  if (!el._wired) { el._wired = true; }
  el.style.animation = 'none';
  void el.offsetWidth;
  el.style.opacity = '1';
  el.style.visibility = 'visible';
  el.style.animation = 'rise .7s ease-out forwards';
  clearTimeout(el._t);
  el._t = setTimeout(() => {
    // The animation uses `forwards`, so its end state is opacity 0. Simply clearing the
    // animation reverts to base CSS at opacity 1 and the pooled element stays on screen
    // forever. Hide it explicitly, or the numbers just pile up.
    el.style.animation = 'none';
    el.style.opacity = '0';
    el.style.visibility = 'hidden';
    if (host.children.length > 12) el.remove(); else popPool.push(el);
  }, 700);
  // Hard cap: never more than 12 nodes on screen, however fast the player clicks.
  while (host.children.length > 12) host.firstElementChild.remove();
}

// ---------------------------------------------------------------- canvas bill
const BILL = { w: 240, h: 120 };
let billCtx = null, bodyGrad = null, pulseAt = 0;

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawBill() {
  const cv = $('bill');
  if (!cv || !cv.getContext) return;
  // Mobile browsers discard 2D contexts when a tab is backgrounded. The `!billCtx` guard
  // below checks the variable, never the context's health, so after a loss it kept a dead
  // reference: clearRect and every draw silently no-op and the bill stays blank for the
  // rest of the session. contextlost drops the reference so the next frame rebuilds it.
  if (cv.isContextLost && cv.isContextLost()) { billCtx = null; bodyGrad = null; return; }
  if (!billCtx) {
    const dpr = window.devicePixelRatio || 1;
    cv.width = BILL.w * dpr;
    cv.height = BILL.h * dpr;
    billCtx = cv.getContext('2d');
    if (billCtx) billCtx.scale(dpr, dpr);
    bodyGrad = billCtx ? billCtx.createLinearGradient(0, 0, 0, BILL.h) : null;
  }
  const ctx = billCtx;
  if (!ctx) return;
  const { w, h } = BILL;
  if (bodyGrad) {
    bodyGrad.addColorStop(0, '#2f7d4f');
    bodyGrad.addColorStop(1, '#1f5c39');
  }
  ctx.clearRect(0, 0, w, h);

  const now = performance.now();
  const age = now - pulseAt;
  const pulse = age < 140 ? 1 - 0.06 * (1 - age / 140) : 1;

  ctx.save();
  ctx.translate(w / 2, h / 2);
  ctx.scale(pulse, pulse);
  ctx.translate(-w / 2, -h / 2);

  // body
  roundRect(ctx, 1.5, 1.5, w - 3, h - 3, 8);
  ctx.fillStyle = bodyGrad || '#2f7d4f';
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = '#14402a';
  ctx.stroke();

  // double border, banknote style
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = 'rgba(143,214,168,0.6)';
  roundRect(ctx, 6, 6, w - 12, h - 12, 5); ctx.stroke();
  ctx.lineWidth = 1;
  ctx.strokeStyle = 'rgba(143,214,168,0.35)';
  roundRect(ctx, 10, 10, w - 20, h - 20, 4); ctx.stroke();

  // portrait: oval with a head and shoulders cut out
  ctx.fillStyle = '#14402a';
  ctx.beginPath();
  ctx.ellipse(w / 2, h / 2, 26, 32, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#2f7d4f';
  ctx.beginPath(); ctx.arc(w / 2, h / 2 - 7, 9, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(w / 2, h / 2 + 15, 16, 12, 0, Math.PI, 0); ctx.fill();

  // corner numerals
  ctx.fillStyle = '#e9fff0';
  ctx.font = '28px Georgia, serif';
  ctx.textBaseline = 'top';
  ctx.fillText('1', 12, 10);
  ctx.fillText('1', w - 24, 10);
  ctx.fillText('1', 12, h - 34);
  ctx.fillText('1', w - 24, h - 34);

  // micro-text rules
  ctx.strokeStyle = 'rgba(233,255,240,0.25)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(34, 16); ctx.lineTo(w - 34, 16);
  ctx.moveTo(34, h - 16); ctx.lineTo(w - 34, h - 16);
  ctx.stroke();

  // shimmer, clipped to the bill. Decorative, so reduced motion simply stops it.
  if (!reducedMotion()) {
    const sweep = ((now % 3000) / 3000) * (w + 120) - 60;
    const g2 = ctx.createLinearGradient(sweep - 40, 0, sweep + 40, h);
    g2.addColorStop(0, 'rgba(255,255,255,0)');
    g2.addColorStop(0.5, 'rgba(255,255,255,0.10)');
    g2.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.save();
    roundRect(ctx, 1.5, 1.5, w - 3, h - 3, 8);
    ctx.clip();
    ctx.fillStyle = g2;
    ctx.fillRect(0, 0, w, h);
    ctx.restore();
  }

  // frenzy rim: the x7 is otherwise invisible
  if (frenzyOn()) {
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#ffcc4d';
    roundRect(ctx, 2, 2, w - 4, h - 4, 8);
    ctx.stroke();
  }
  ctx.restore();
}

// ---------------------------------------------------------------- CC parity
const MILK_STEPS = [0, 1, 2, 3, 5, 8, 13, 21, 34];   // thresholds for ranks 0..8
const MILK_DROP = 0.01;                               // per click
const GOLDEN_CHANCE = 0.0015;                        // per tick, about one per 3 min
const GOLDEN_MS = 15000;
const GOLDEN_FLOOR = 60000;      // hard minimum between spawns, whatever the roll says
const FRENZY_MS = 15000;
const FRENZY_MULT = 7;

const milkRank = () => { let r = 0; for (let i = 0; i < MILK_STEPS.length; i++) if (state.milk.progress >= MILK_STEPS[i]) r = i; return r; };
const milkMult = () => Math.pow(1.05, milkRank());
const frenzyOn = () => (rt.frenzyUntil || 0) > performance.now();
const cpsBoostOn = () => (rt.cpsUntil || 0) > performance.now();
const cpsBoostMult = () => (cpsBoostOn() ? 2 : 1);

function dropMilk() {
  if (Math.random() >= MILK_DROP) return;
  const amt = 0.02 / (1 + 0.5 * milkRank());
  state.milk.progress = Math.min(state.milk.progress + amt, MILK_STEPS[MILK_STEPS.length - 1]);
  state.milk.lifetime += amt;
}

// Drinking trades the rank back for ascend points. Progress resets, so the ladder has
// to be climbed again -- same trade as CC.
function drinkMilk() {
  const rank = milkRank();
  if (rank < 1) return;
  const bonus = Math.floor(state.ascend.earned * 0.1);
  state.milk.progress = 0;
  state.ascend.points += bonus;
  save();
  toast(`Drank the milk. Rank reset, +${fmt(bonus)} ascend points.`, 'good', 6000);
}

// ------------------------------------------------------------------ golden cookies
const GOLDEN_PRIZES = [
  { w: 20, label: 'Click frenzy: ×7 click for 15s', run: () => { rt.frenzyUntil = performance.now() + FRENZY_MS; } },
  { w: 25, label: 'A free building', run: () => {
      // Only buildings the player already owns and is not capped on. Handing out a tier
      // they have never touched trivialises the whole store.
      const open = BUILDINGS.map((b, i) => i)
        .filter(i => state.buildings[i] > 0 && state.buildings[i] < CAP);
      if (open.length) {
        const i = open[Math.floor(Math.random() * open.length)];
        state.buildings[i]++;
      } else if (state.buildings[0] < CAP) {
        state.buildings[0]++;            // nothing owned yet: fall back to the first tier
      } else {
        state.coins = Math.min(state.coins + d.cps * 180, CEIL);
        return 'production instead — no buildings owned yet';
      }
    } },
  { w: 25, label: 'A free upgrade', run: () => {
      // Drawn from what is actually unlocked and unbought, never from the hidden pool.
      const open = visibleUpgrades();
      if (open.length) buyUpgrade(open[Math.floor(Math.random() * open.length)]);
    } },
  { w: 15, label: '3 minutes of production', run: () => { state.coins = Math.min(state.coins + d.cps * 180, CEIL); } },
  { w: 15, label: '×2 cps for 30s', run: () => { rt.cpsUntil = performance.now() + 30000; } },
];

function spawnGolden() {
  const host = $('goldens');
  if (!host || host.firstChild) return;                 // one on screen, maximum
  // Hard floor on spawn rate, independent of the per-tick roll. Nothing may bypass it.
  const now = performance.now();
  if (now - (rt.lastGolden || 0) < GOLDEN_FLOOR) return;
  rt.lastGolden = now;
  const el = document.createElement('button');
  el.type = 'button';
  el.className = 'gcookie';
  el.textContent = '💰';
  el.setAttribute('aria-label', 'Golden cookie');
  const w = Math.max(1, host.clientWidth - 34), h = Math.max(1, host.clientHeight - 34);
  el.style.left = Math.random() * w + 'px';
  el.style.top = Math.random() * h + 'px';
  if (reducedMotion()) el.style.transition = 'none';
  el.addEventListener('pointerdown', e => {
    e.stopPropagation();
    el.remove();
    let r = Math.random() * 100, pick = GOLDEN_PRIZES[0];
    for (const p of GOLDEN_PRIZES) { if (r < p.w) { pick = p; break; } r -= p.w; }
    try { pick.run(); } catch {}
    sfx('golden');
    toast(pick.label, 'good', 5000);
  });
  host.append(el);
  const born = performance.now();
  (function fade() {
    if (!el.parentNode) return;
    const age = performance.now() - born;
    if (age > GOLDEN_MS - 3000) el.classList.add('fade');
    if (age < GOLDEN_MS) requestAnimationFrame(fade);
    else el.remove();
  })();
}

// ---------------------------------------------------------------- graphs
// Ring buffers live in rt and are never saved: a graph that empties on reload is fine,
// persisting it would grow the save for no benefit.
const GRAPH_N = 2400;                          // 10 minutes at one sample per tick
rt.gCoins = new Float64Array(GRAPH_N);
rt.gCps = new Float64Array(GRAPH_N);
rt.gI = 0;

function graphSample() {
  rt.gCoins[rt.gI] = state.coins;
  rt.gCps[rt.gI] = d.cps;
  rt.gI = (rt.gI + 1) % GRAPH_N;
}

function drawGraph(canvas, arr) {
  const w = canvas.width, h = canvas.height;
  const ctx = canvas.getContext('2d');
  if (!ctx) return;
  ctx.clearRect(0, 0, w, h);
  let max = 1;
  for (let i = 0; i < GRAPH_N; i++) if (arr[i] > max) max = arr[i];
  // Log scale is mandatory: the range spans orders of magnitude and a linear axis
  // renders the whole game as a flat line pinned to zero.
  const lmax = Math.log10(max + 1), n = Math.min(rt.gI || GRAPH_N, GRAPH_N);
  const start = rt.gI < GRAPH_N ? 0 : rt.gI;
  ctx.beginPath();
  for (let k = 0; k < n; k++) {
    const v = arr[(start + k) % GRAPH_N];
    const x = k / (GRAPH_N - 1) * w;
    const y = h - (Math.log10(v + 1) / lmax) * (h - 2) - 1;
    k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.strokeStyle = graphInk();
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

// getComputedStyle forces a style recalc. Two graphs redrawing every frame would pay
// for that 60 times a second, so the ink colour is cached and only re-read on theme change.
let inkCache = '';
function graphInk() {
  if (inkCache) return inkCache;
  const v = getComputedStyle(document.documentElement).getPropertyValue('--accent');
  inkCache = (v || '#ffffff').trim();
  return inkCache;
}

// Painters used to run inside render() at 60 Hz, writing several properties on every
// chip and row each frame. That forces a style recalc and a repaint of every glowing
// element 60 times a second, which reads as flicker. Repaint only when the state the
// painter depends on has actually changed.
const sig = {};
function changed(key, value) {
  if (sig[key] === value) return false;
  sig[key] = value;
  return true;
}

function paintParity() {
  const rank = milkRank();
  if (!changed('parity', rank + '|' + state.milk.progress.toFixed(4))) return;
  const nextStep = rank + 1 < MILK_STEPS.length ? MILK_STEPS[rank + 1] : MILK_STEPS[MILK_STEPS.length - 1];
  const prevStep = MILK_STEPS[rank];
  const span = Math.max(1e-6, nextStep - prevStep);
  $('milkbar').firstElementChild.style.width = Math.min(100, (state.milk.progress - prevStep) / span * 100).toFixed(1) + '%';
  $('milktip').textContent = rank >= MILK_STEPS.length - 1 ? 'MILK MAX' : `MILK ${rank} · ×${milkMult().toFixed(2)}`;
  $('milkbar').hidden = rank < 1 && state.milk.progress <= 0;
}

// 50 clicks on the bill inside 2 seconds. This used to grant a free golden cookie,
// which made it a faucet: the counter cleared and retriggered, so a normal clicking rate
// produced a cookie every couple of seconds, and each one is 25% a free building. It
// now grants a click frenzy, and has its own cooldown so it cannot spam.
let fast = [], fastCooldown = 0;
function checkFrenzyClicks() {
  const t = performance.now();
  if (t < fastCooldown) return;
  fast.push(t);
  while (fast.length && t - fast[0] > 2000) fast.shift();
  if (fast.length >= 50) {
    fast = [];
    fastCooldown = t + 60000;
    rt.frenzyUntil = t + FRENZY_MS;
    toast('HACKING — click frenzy', 'warn', 4000);
  }
}

// ---------------------------------------------------------------- debug console
const CONSOLE_HELP = [
  'add [n]     grant coins (not counted as earned)',
  'build [n]   grant n units of a random building, up to the 1000 cap',
  'milk [n]    set milk rank (0-8)',
  'golden      spawn a golden cookie now',
  'ascend      trigger an Ascend',
  'legacy      trigger a Legacy',
  'reset       hard reset, same as Preferences',
  'help        this list',
];
function runConsole(line) {
  const [cmd, arg] = line.trim().split(/\s+/);
  const n = Number(arg);
  switch ((cmd || '').toLowerCase()) {
    case 'add': state.coins = Math.min(state.coins + (isFinite(n) ? n : 1e9), CEIL); return `+${fmt(isFinite(n) ? n : 1e9)} coins`;
    case 'build': {
      const k = Math.max(1, Math.min(isFinite(n) ? n : 10, CAP));
      const open = BUILDINGS.map((b, i) => i).filter(i => state.buildings[i] < CAP);
      if (!open.length) return 'every building is capped';
      const i = open[Math.floor(Math.random() * open.length)];
      state.buildings[i] = Math.min(CAP, state.buildings[i] + k);
      return `+${k} ${BUILDINGS[i].label}`;
    }
    case 'milk': state.milk.progress = MILK_STEPS[Math.max(0, Math.min(8, isFinite(n) ? n : 8))]; return `milk rank ${milkRank()}`;
    case 'golden': spawnGolden(); return 'golden cookie spawned';
    case 'ascend': doAscend(); return `ascend attempted (needs runEarned >= ${fmt(ASCEND_AT)})`;
    case 'legacy': doLegacy(); return 'legacy attempted (needs 3 ascends)';
    // No `fill`: it maxed every tree node, perk, upgrade and achievement in one keypress,
    // which is an instant win in a game about long-term progression.
    case 'reset': store.del(KEY); location.reload(); return 'resetting';
    case 'help': return CONSOLE_HELP.join('\n');
    default: return 'unknown command. try "help"';
  }
}

function paintBars() {
  let base = 0;
  const parts = [];
  for (let i = 0; i < BUILDINGS.length; i++) {
    const v = state.buildings[i] * buildingCps(i) * (has('u_b' + i) ? 3 : 1);
    parts.push(v);
    base += v;
  }
  if (!changed('bars', parts.join(',') + '|' + Math.floor(d.cps))) return;
  parts.forEach((v, i) => {
    const el = ui2.bars[i];
    if (!el) return;
    const pct = base > 0 ? (v / base) * 100 : 0;
    el.fill.style.width = pct.toFixed(2) + '%';
    el.val.textContent = v > 0 ? fmt(v) + ' (' + pct.toFixed(0) + '%)' : '—';
  });
  $('barbase').textContent = `Buildings supply ${fmt(base)} base cps of ${fmt(d.cps)} total. ` +
    `The rest is multipliers.`;
}

function paintOwned() {
  const list = UPGRADES.filter(u => has(u.id));
  if (!changed('owned', list.map(u => u.id).join(','))) return;
  const host = $('owngrid');
  host.innerHTML = '';
  for (const u of list) {
    const el = document.createElement('div');
    el.className = 'oico';
    el.textContent = u.icon;
    el.title = `${u.name} — ${u.effect}`;
    host.append(el);

function paintAchProgress() {
  const n = achUnlocked();
  if (!changed('achpanel', n)) return;
  const pct = (n / ACHIEVEMENTS.length) * 100;
  $('achfill').style.width = pct.toFixed(1) + '%';

// Stats as a centre-band panel. Rebuilt only when the numbers actually move -- innerHTML
// on a live panel 4x/second is wasteful and it also destroys any text selection.
function paintStats() {
  const sigKey = [state.coins, state.totalEarned, state.runEarned, state.clicks,
    state.ascend.points, state.legacy.points, d.cps, state.buildings.join(''),
